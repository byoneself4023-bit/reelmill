# 윈도우 처음 설치 시험 — 노션 「준비」의 윈도우 명령을 그대로 따라 한 뒤 4·5·6단계 스크립트를 돌려 본다.
# 손으로 실행한다(Actions 탭 → windows-setup → Run workflow, 또는 gh workflow run windows-setup.yml).
# Claude Code 로그인과 일레븐랩스·Groq 호출은 하지 않는다(키·크레딧이 필요).
name: windows-setup

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell   # 수강생이 쓰는 Windows PowerShell 5.1
    steps:
      - uses: actions/checkout@v4

      - name: 1 기본 도구 설치 (노션과 같은 winget 패키지)
        run: |
          winget --version
          foreach ($id in "Gyan.FFmpeg", "astral-sh.uv", "OpenJS.NodeJS.LTS", "Git.Git") {
            # 노션에서는 약관 동의를 물으면 Y — 여기서는 플래그로 미리 동의한다
            winget install --id $id -e --accept-source-agreements --accept-package-agreements --disable-interactivity
            "winget $id → 종료 코드 $LASTEXITCODE"
          }
          exit 0

      - name: 2 PowerShell 다시 열기 (설치로 바뀐 PATH 다시 읽기)
        run: |
          $paths = [Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [Environment]::GetEnvironmentVariable("Path", "User")
          $paths.Split(";") | Where-Object { $_ } | ForEach-Object { Add-Content -Path $env:GITHUB_PATH -Value $_ }

      - name: 3 설치 확인
        run: |
          ffmpeg -version | Select-Object -First 1
          uv --version
          node --version
          git --version
          Get-Command ffmpeg, uv, node, npm, npx | Format-Table Name, Source

      - name: 4 스크립트 실행 허용 (노션과 같은 명령)
        run: |
          Get-ExecutionPolicy -List
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          Get-ExecutionPolicy -List

      - name: 5 npm install · 렌더용 크롬 받기
        working-directory: remotion
        run: |
          npm install
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npx remotion browser ensure
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: 6 시험용 에피소드 준비 (나레이션 대신 무음 66.6초)
        run: |
          $ep = Join-Path $env:RUNNER_TEMP "ep"
          Copy-Item -Recurse tests/fixtures/line1-left $ep
          ffmpeg -v error -f lavfi -i anullsrc=r=44100:cl=mono -t 66.6 -q:a 9 (Join-Path $ep "narration.mp3")
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "EP=$ep" | Add-Content -Path $env:GITHUB_ENV

      - name: 7 파이썬 설치 없이 uv run (uv 가 파이썬을 받는지)
        env:
          UV_PYTHON_PREFERENCE: only-managed   # 러너에 깔린 파이썬은 쓰지 않는다
        run: |
          uv run .claude/skills/shorts-make/scripts/status.py $env:EP
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv python list --only-installed

      - name: 8 4단계 스타일 시안
        env:
          UV_PYTHON_PREFERENCE: only-managed
        run: |
          uv run .claude/skills/shorts-style-drafts/scripts/make_drafts.py $env:EP
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: 9 5단계 영상·커버 렌더
        env:
          UV_PYTHON_PREFERENCE: only-managed
        run: |
          uv run .claude/skills/shorts-render/scripts/make_video.py $env:EP --stills
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv run .claude/skills/shorts-render/scripts/make_video.py $env:EP --render
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ffprobe -v error -show_entries format=duration -of csv=p=0 (Join-Path $env:EP "video.mp4")

      - name: 10 6단계 제목 검사
        env:
          UV_PYTHON_PREFERENCE: only-managed
        run: |
          uv run .claude/skills/shorts-upload/scripts/title_check.py --title "4호선 땅속에 꽈배기 터널이 있는 이유" --screen "혼자 반대로 달린다"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: 11 한글 폴더 이름에서 커버 렌더
        env:
          UV_PYTHON_PREFERENCE: only-managed
        run: |
          $hangul = -join [char[]](0xD55C, 0xAE00, 0xD3F4, 0xB354)   # 「한글폴더」(스크립트 파일 인코딩과 상관없게)
          $dir = Join-Path $env:RUNNER_TEMP $hangul
          Copy-Item -Recurse $env:EP $dir
          uv run .claude/skills/shorts-render/scripts/make_video.py $dir --cover
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item (Join-Path $dir "cover.png") (Join-Path $env:EP "cover-hangul.png")

      - name: 결과물 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-results
          path: |
            ${{ env.EP }}/video.mp4
            ${{ env.EP }}/cover.png
            ${{ env.EP }}/cover-hangul.png
            ${{ env.EP }}/drafts/board.png
            ${{ env.EP }}/render/check/*.png
          if-no-files-found: warn
